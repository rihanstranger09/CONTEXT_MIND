apiVersion: v1
kind: ConfigMap
metadata:
  name: task-app-config
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: tasks
  POSTGRES_USER: appuser
  API_URL: http://backend:5000
---
apiVersion: v1
kind: Secret
metadata:
  name: task-app-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me-before-deploying
