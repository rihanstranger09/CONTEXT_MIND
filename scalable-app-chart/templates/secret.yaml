{{- if not .Values.postgresql.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scalable-app-chart.postgresSecretName" . }}
  labels:
    {{- include "scalable-app-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgresql.existingSecretKey }}: {{ .Values.postgresql.password | quote }}
{{- end }}
