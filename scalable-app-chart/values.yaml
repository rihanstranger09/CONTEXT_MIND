nameOverride: ""
fullnameOverride: ""

backend:
  replicaCount: 2
  image:
    repository: scalable-app-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 2
  image:
    repository: scalable-app-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8501
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  image: postgres:16-alpine
  database: tasks
  username: appuser
  # Demo-only default. Override with --set postgresql.password=... or use existingSecret.
  password: change-me-before-deploying
  existingSecret: ""
  existingSecretKey: POSTGRES_PASSWORD
  servicePort: 5432
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
